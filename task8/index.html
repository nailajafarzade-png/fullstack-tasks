<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="scene">

  <div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <div class="comet"></div>
  <div class="sun"></div>


  <div class="orbit mercury-orbit">
    <div class="planet mercury"></div>
  </div>

  <div class="orbit venus-orbit">
    <div class="planet venus"></div>
  </div>

  <div class="orbit earth-orbit">
    <div class="planet earth"></div>
  </div>

  <div class="orbit mars-orbit">
    <div class="planet mars"></div>
  </div>

  <div class="orbit jupiter-orbit">
    <div class="planet jupiter"></div>
  </div>

  <div class="info-panel">
    <span>PLANETARIUM</span>
    <h1>Solar system</h1>
    <p>
      There is 5 planet rounding around sun
      Each of them has unique time limit
    </p>

    <small>Teleskop kalibrlənir</small>

    <div class="calibration">
      <div class="calibration-fill"></div>
    </div>
  </div>

  <div class="duration-panel">
    <h2>Orbits duration</h2>
    <div class="divider"></div>
    <ul>
      <li>
        <span class="dot mercury-dot"></span>
        <span class="planet-name">Mercury</span>
        <span class="duration">88 day</span>
      </li>

      <li>
        <span class="dot venus-dot"></span>
        <span class="planet-name">Venus</span>
        <span class="duration">225 day</span>
      </li>

      <li>
        <span class="dot earth-dot"></span>
        <span class="planet-name">Earth</span>
        <span class="duration">365 day</span>
      </li>

      <li>
        <span class="dot mars-dot"></span>
        <span class="planet-name">Mars</span>
        <span class="duration">687 day</span>
      </li>

      <li>
        <span class="dot jupiter-dot"></span>
        <span class="planet-name">Jupiter</span>
        <span class="duration">4333 day</span>
      </li>
    </ul>
  </div>
</main>

<footer>
  <div class="legend">
    <span><i class="legend-dot star-dot"></i>Star</span>
    <span><i class="legend-dot inner-dot"></i>Inner planets</span>
    <span><i class="legend-dot outer-dot"></i>Outer planets</span>
  </div>

  <span class="footer-note">Destinations is not real</span>
</footer>


</body>



</html>
